# yaml-language-server: $schema=../../.schema/razdfile.schema.json

# Razdfile.yml - полный пример с unified dependencies
# Демонстрирует все возможности формата

version: "1"

# =============================================================================
# Unified Dependencies
# =============================================================================
dependencies:
  using: "mise"
  
  # Простой формат tool@version
  ensure:
    - "node@22"
    - "python@3.11"
    - "go@1.22"
  
  # Pass-through конфигурация для mise
  extra:
    mise:
      env:
        NODE_ENV: development
        DEBUG: "true"
        _:
          file: .env.local
          path:
            - ./node_modules/.bin
            - ./bin
      settings:
        auto_install: true
        experimental: false

# =============================================================================
# TASKFILE Configuration (стандартный Taskfile формат)
# =============================================================================

# Глобальные переменные для задач
vars:
  PROJECT_NAME: my-app
  BUILD_DIR: ./dist

# Глобальные переменные окружения для задач
env:
  GOOS: linux
  GOARCH: amd64

tasks:
  # Задача по умолчанию
  default:
    desc: "Запуск полного цикла разработки"
    cmds:
      - task: install
      - task: dev

  # Установка зависимостей
  install:
    desc: "Установка всех зависимостей проекта"
    cmds:
      - npm install
      - pip install -r requirements.txt
    sources:
      - package.json
      - requirements.txt
    generates:
      - node_modules/**/*
    method: checksum

  # Режим разработки
  dev:
    desc: "Запуск в режиме разработки"
    deps:
      - install
    cmds:
      - npm run dev
    interactive: true

  # Сборка проекта
  build:
    desc: "Сборка проекта для production"
    deps:
      - install
    cmds:
      - npm run build
      - go build -o {{.BUILD_DIR}}/{{.PROJECT_NAME}} ./cmd/main.go
    env:
      NODE_ENV: production

  # Тестирование
  test:
    desc: "Запуск тестов"
    cmds:
      - npm test
      - go test ./...

  # Линтинг
  lint:
    desc: "Проверка кода линтерами"
    cmds:
      - npm run lint
      - golangci-lint run

  # Очистка
  clean:
    desc: "Очистка артефактов сборки"
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -rf node_modules
      - rm -rf __pycache__

  # CI/CD пайплайн
  ci:
    desc: "Полный CI пайплайн"
    cmds:
      - task: install
      - task: lint
      - task: test
      - task: build

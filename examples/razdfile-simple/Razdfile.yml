# yaml-language-server: $schema=../../.schema/razdfile.schema.json

version: "1"

# Unified dependencies - simple format
dependencies:
  using: "mise"
  ensure:
    - "node@22"
    - "python@3.11"

tasks:
  default:
    deps: [install]
    cmds: [npm run dev]
  
  install: npm install
  dev: npm run dev
  build: npm run build

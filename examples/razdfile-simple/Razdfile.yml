# yaml-language-server: $schema=../../schemas/razdfile.json

version: "1"

mise:
  tools:
    node: "22"
    python: "3.11"

tasks:
  default:
    cmds:
      - task: install
      - task: dev
  
  install:
    desc: "Установка зависимостей"
    cmds:
      - npm install
  
  dev:
    desc: "Запуск dev сервера"
    cmds:
      - npm run dev
  
  build:
    desc: "Сборка проекта"
    cmds:
      - npm run build

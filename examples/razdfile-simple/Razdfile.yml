# yaml-language-server: $schema=../../.schema/razdfile.schema.json

version: "1"

# Unified dependencies - simple format
dependencies:
  using: "mise"
  ensure:
    - "node@22"
    - "python@3.11"

tasks:
  default:
    cmds:
      - task: install
      - task: dev
  
  install:
    desc: "Установка зависимостей"
    cmds:
      - npm install
  
  dev:
    desc: "Запуск dev сервера"
    cmds:
      - npm run dev
  
  build:
    desc: "Сборка проекта"
    cmds:
      - npm run build

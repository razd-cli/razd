# yaml-language-server: $schema=../../.schema/razdfile.schema.json
version: "1"

# =============================================================================
# Unified Dependencies
# =============================================================================
dependencies:
  using: "mise"
  
  ensure:
    - "node@22"
    - "python@3.11"
  
  extra:
    mise:
      env:
        NODE_ENV: development
      settings:
        experimental: true

# =============================================================================
# Tasks
# =============================================================================
tasks:
  default:
    desc: Run install and dev tasks
    cmds:
      - task: install
      - task: dev

  install:
    desc: Install project dependencies
    cmds:
      - npm install

  dev:
    desc: Start development server
    cmds:
      - npm run dev

  build:
    desc: Build for production
    cmds:
      - npm run build

  test:
    desc: Run tests
    cmds:
      - npm test

  lint:
    desc: Lint code
    cmds:
      - npm run lint

# yaml-language-server: $schema=../../.schema/razdfile.schema.json
version: "1"

# =============================================================================
# Unified Dependencies
# =============================================================================
dependencies:
  using: "mise"
  
  ensure:
    - "node@22"
    - "python@3.11"
  
  extra:
    mise:
      env:
        NODE_ENV: development
      settings:
        experimental: true

# =============================================================================
# Tasks
# =============================================================================
tasks:
  default:
    deps: [install]
    cmds: [npm run dev]

  install: npm install
  dev: npm run dev
  build: npm run build
  test: npm test
  lint: npm run lint


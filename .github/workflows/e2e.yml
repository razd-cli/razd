name: E2E

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "1.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - run: go build -o razd ./cmd/razd
      - uses: actions/upload-artifact@v4
        with:
          name: razd-linux-amd64
          path: razd

  e2e-mise:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Trust mise config
        run: mise trust examples/nodejs-project/mise.toml || true
      - name: razd list (mise)
        run: ./razd list -d examples/nodejs-project
      - name: razd list --json (mise)
        run: ./razd list --json -d examples/nodejs-project
      - name: razd run dev (mise, --no-install)
        run: ./razd run dev -d examples/nodejs-project -y --no-install

  e2e-devbox:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - name: Install devbox
        run: |
          curl -fsSL https://get.jetify.com/devbox | bash
          echo "$HOME/.devbox/bin" >> $GITHUB_PATH
      - name: razd list (devbox)
        run: ./razd list -d examples/nodejs-devbox
      - name: razd list --json (devbox)
        run: ./razd list --json -d examples/nodejs-devbox
      - name: razd run dev (devbox, --no-install)
        run: ./razd run dev -d examples/nodejs-devbox -y --no-install

  e2e-unified:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - name: Install devbox
        run: |
          curl -fsSL https://get.jetify.com/devbox | bash
          echo "$HOME/.devbox/bin" >> $GITHUB_PATH
      - name: razd list (unified-dependencies)
        run: ./razd list -d examples/unified-dependencies
      - name: razd run default (unified-dependencies)
        run: ./razd run default -d examples/unified-dependencies -y

  e2e-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - name: Install mise
        run: |
          irm https://mise.run | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -Append $env:GITHUB_PATH
        shell: pwsh
      - name: razd list (mise)
        run: .\razd.exe list -d examples\nodejs-project
        shell: pwsh
      - name: razd list --json (mise)
        run: .\razd.exe list --json -d examples\nodejs-project
        shell: pwsh
name: E2E

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "1.x"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - run: go build -o razd ./cmd/razd
      - uses: actions/upload-artifact@v4
        with:
          name: razd-linux-amd64
          path: razd

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - run: go build -o razd ./cmd/razd
      - uses: actions/upload-artifact@v4
        with:
          name: razd-macos-amd64
          path: razd

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - run: go build -o razd.exe ./cmd/razd
      - uses: actions/upload-artifact@v4
        with:
          name: razd-windows-amd64
          path: razd.exe

  # ── CLI smoke tests ───────────────────────────────────────────────

  e2e-cli-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - name: razd --version
        run: ./razd --version
      - name: razd -V
        run: ./razd -V
      - name: razd --help
        run: ./razd --help

  e2e-cli-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: razd-macos-amd64
          path: .
      - run: chmod +x razd
      - name: razd --version
        run: ./razd --version
      - name: razd -V
        run: ./razd -V
      - name: razd --help
        run: ./razd --help

  e2e-cli-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: razd-windows-amd64
          path: .
      - name: razd --version
        run: .\razd.exe --version
        shell: pwsh
      - name: razd -V
        run: .\razd.exe -V
        shell: pwsh
      - name: razd --help
        run: .\razd.exe --help
        shell: pwsh

  # ── mise examples: nodejs-project ──────────────────────────────

  e2e-mise-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - uses: jdx/mise-action@v2
        with:
          install_args: "--yes"
      - name: Trust mise config
        run: mise trust examples/nodejs-project/mise.toml || true
      - name: razd list
        run: ./razd list -d examples/nodejs-project
      - name: razd list --json
        run: ./razd list --json -d examples/nodejs-project
      - name: razd run dev
        run: ./razd run dev -d examples/nodejs-project -y

  e2e-mise-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-macos-amd64
          path: .
      - run: chmod +x razd
      - uses: jdx/mise-action@v2
        with:
          install_args: "--yes"
      - name: Trust mise config
        run: mise trust examples/nodejs-project/mise.toml || true
      - name: razd list
        run: ./razd list -d examples/nodejs-project
      - name: razd run dev
        run: ./razd run dev -d examples/nodejs-project -y

  # ── devbox examples: nodejs-devbox ─────────────────────────────

  e2e-devbox-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - uses: jetify-com/devbox-install-action@v0.12.0
      - name: razd list
        run: ./razd list -d examples/nodejs-devbox
      - name: razd run default
        run: ./razd run default -d examples/nodejs-devbox -y

  # ── devbox examples: unified-dependencies ───────────────────────

  e2e-unified-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-linux-amd64
          path: .
      - run: chmod +x razd
      - uses: jetify-com/devbox-install-action@v0.12.0
      - name: razd list
        run: ./razd list -d examples/unified-dependencies
      - name: razd run default
        run: ./razd run default -d examples/unified-dependencies -y

  # ── Windows (mise only, experimental) ──────────────────────────

  e2e-windows:
    needs: build-windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: razd-windows-amd64
          path: .
      - uses: jdx/mise-action@v2
        with:
          install_args: "--yes"
      - name: razd list (mise)
        run: .\razd.exe list -d examples\nodejs-project
        shell: pwsh
      - name: razd list --json (mise)
        run: .\razd.exe list --json -d examples\nodejs-project
        shell: pwsh
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the released version to the pushed tag. Without this,
          # goreleaser uses `git describe`, which can pick a higher semver
          # tag (e.g. v1.6.2-dev.7) when both a stable and a dev tag point at
          # the same commit, releasing to the wrong (existing) release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
